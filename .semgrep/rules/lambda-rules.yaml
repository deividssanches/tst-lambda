rules:
  - id: lambda-no-console-log
    patterns:
      - pattern: console.log(...)
    message: "Use logger estruturado (Winston/Pino) em Lambda, não console.log"
    languages: [python]
    severity: WARNING

  - id: lambda-hardcoded-secret
    patterns:
      - pattern-regex: (aws_secret_access_key|password\s*=\s*["'].*["'])
    message: "Possível secret hardcoded - usar Secrets Manager/SSM"
    languages: [python]
    severity: WARNING

  - id: lambda-no-try-catch-python
    patterns:
      - pattern: |
          def lambda_handler(...):
              ...
      - pattern-not-inside: |
          def lambda_handler(...):
              try:
                  ...
              except ...:
                  ...
    message: "Handler sem try/except"
    languages: [python]
    severity: WARNING

  - id: lambda-wildcard-iam
    patterns:
      - pattern: '"Action": "*"'
      - pattern: '"Resource": "*"'
    message: "IAM muito permissivo em Lambda - princípio do menor privilégio"
    languages: [json, yaml]
    severity: ERROR

  - id: lambda-no-try-catch-js
    patterns:
      - pattern: |
          exports.handler = async ($...ARGS) => {
            $BODY
          }
      - pattern-not-inside: |
          exports.handler = async ($...ARGS) => {
            try {
              $...BODY
            } catch ($ERR) {
              $...H
            }
          }
    message: "Handler da Lambda sem try/catch - vai dar cold start silencioso"
    languages: [javascript, typescript]
    severity: WARNING
